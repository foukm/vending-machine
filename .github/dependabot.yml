version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
    groups:
      security-runtime:
        applies-to: security-updates
        dependency-type: "production"
      security-dev:
        applies-to: security-updates
        dependency-type: "development"

  - package-ecosystem: "composer"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
    groups:
      security-runtime:
        applies-to: security-updates
        dependency-type: "production"
      security-dev:
        applies-to: security-updates
        dependency-type: "development"
